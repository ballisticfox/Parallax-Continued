//
//  This file tells Parallax the names and types of each parameter
//  Any edits to the shader need to be reflected here in the input properties, but it makes more sense than hardcoding them
//

// IF YOU ARE A USER, DO NOT EDIT THIS FILE
// For mod authors, DO NOT include a copy of this file in your projects - this is an internal config
ParallaxShaderProperties
{
    Textures
    {
        name = _MainTexLow
        name = _MainTexMid
        name = _MainTexHigh
        name = _MainTexSteep

        name = _BumpMapLow
        name = _BumpMapMid
        name = _BumpMapHigh
        name = _BumpMapSteep

        name = _InfluenceMap
        name = _DisplacementMap
        name = _OcclusionMap

        // Texture2DArray: 6 slices, one per cube face. Indexed by mesh.uv3 (TEXCOORD2) written by PQSMod_PlanetUV.
        name = _PlanetColormap

        // Texture2DArray: 6-slice heightmap sampled in the vertex shader for far-field GPU displacement.
        name = _PlanetHeightmap
    }
    Floats
    {
        // Tessellation params _MaxTessellation, _TessellationEdgeLength and _MaxTessellationRange are defined in the global cfg

        // Displacement
        name = _DisplacementScale
        name = _DisplacementOffset

        // Texture Blending
        name = _LowMidBlendStart
        name = _LowMidBlendEnd
        name = _MidHighBlendStart
        name = _MidHighBlendEnd

        name = _SteepPower
        name = _SteepContrast
        name = _SteepMidpoint

        // Lighting
        name = _SpecularPower
        name = _SpecularIntensity
        name = _FresnelPower
        name = _EnvironmentMapFactor
        name = _RefractionIntensity

        // Misc
        name = _Tiling
        name = _Hapke
        name = _BumpScale

        // GPU Heightmap Displacement (Phase 1.5)
        name = _HeightScale
        name = _HeightOffset
        name = _NearFieldEnd
        name = _BlendWidth

        // Distance over which the tiling _DisplacementMap adds vertex bumps. Decoupled from
        // _MaxTessellationRange so tile bumps stay close-range while GPU tessellation can reach further.
        // If omitted in a body config, C# defaults this to _NearFieldEnd (clean handoff to the GPU heightmap)
        // or _MaxTessellationRange (backwards-compatible behavior when no heightmap is configured).
        name = _TileDisplacementRange
    }
    Vectors
    {

    }
    Colors
    {
        name = _EmissionColor
    }
    Ints
    {
        
    }
}